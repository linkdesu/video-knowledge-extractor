name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # 斜杠与横杠两种命名都要覆盖：分支规范里 `feat-r54-…` / `fix-r57-…` 是横杠形式，
      # 只写 `feat/**` 时这类分支推送不会触发 Windows CI（r57 / #74）。
      - "feat/**"
      - "fix/**"
      - "feat-*"
      - "fix-*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Fetch ffmpeg (pinned)
        run: bun run apps/desktop/scripts/fetch-ffmpeg.ts

      # 把 ffmpeg.exe/ffprobe.exe 放进 PATH，供打包前的检查/后续步骤使用
      - name: Add ffmpeg to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/apps/desktop/win-resources/ffmpeg" >> $GITHUB_PATH

      - name: Test
        run: bun run test

      - name: Build
        run: bun run --cwd apps/desktop build

      - name: Package (NSIS)
        run: bun run --cwd apps/desktop package:win

      # #89：安装后属性页读的就是 win-unpacked/Video Notes.exe 的版本资源，
      # 公司名/产品名/版权/版本号不符合 app-metadata.ts 就在这里失败，不把坏包传上去。
      - name: Verify exe metadata
        run: bun run --cwd apps/desktop check:win-metadata

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: video-notes-windows-installer
          path: apps/desktop/release-win/*.exe
          if-no-files-found: error
