# 项目级 agent → 模型映射（video-notes）
# 原则：这里只写角色别名（@task / @slow / @smol / @plan / @default），不写具体模型 ID。
# 具体模型只在全局 ~/.omp/agent/config.yml 的 modelRoles 里配置；换模型只改 modelRoles，subagent 不会因模型 ID 失效而无法启动。
# 校验：omp config get task.agentModelOverrides --json；omp models find <q>
task:
  agentModelOverrides:
    # 写产物的 runner
    task: "@task"
    qwen-worker: "@task"
    flash-worker: "@default"
    # 只读调研
    scout: "@smol"
    sonic: "@smol"
    # 评审 / cross-judge：slow（Sol）+ plan（K3）两模型跨模型对照
    sol-reviewer: "@slow"
    reviewer: "@slow"
    security-reviewer: "@slow"
    k3-reviewer: "@plan"
