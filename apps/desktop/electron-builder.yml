# Windows x64 NSIS 打包配置，配合 scripts/package-win.ts 的 staging 目录使用。
# 仓库没有图标文件，icon 相关键全部省略（electron-builder 26 允许缺省）。
# productName / copyright 不在这里写：它们与 companyName 一起由 scripts/app-metadata.ts 定义，
# package-win.ts 以 `-c.productName=… -c.copyright=…` 覆盖，避免两处各写一份（r67 / #89）。
appId: me.xieal.video-notes

directories:
  app: release-win/stage
  output: release-win
  buildResources: build

files:
  - "out/**"
  - "package.json"
  - "node_modules/**"

# sherpa 的 .node 与 dll 不能被 asar 虚拟文件系统加载，必须解包
asarUnpack:
  - "**/node_modules/sherpa-onnx-*/**"

extraResources:
  - from: win-resources/ffmpeg
    to: ffmpeg

npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # 仓库暂无图标：icon 键省略。r64：不再关闭 signAndEditExecutable——只有它打开，
  # 打包器才会把 package.json 的 version 写进 Video Notes.exe 的版本资源（属性页 FileVersion/ProductVersion）。
  artifactName: "${productName}-${version}-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: Video Notes
